
services:
  web:
    build: ./app
    ports:
      - "80:80"
    volumes:
      - ./app:/var/www/html:z
    environment:
      DB_HOST: IP_VM2
      DB_PORT: "5432"
      DB_NAME: app_db
      DB_USER: root
      DB_PASS: password
    restart: unless-stopped

  db:
    build: ./db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data:z

volumes:
  pgdata:
